<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Detroit Sports Scoreboard</title>
<link rel="stylesheet" href="style.css?v=13">
</head>

<body>

<div class="container">

    <!--
    TIGERS SECTION DISABLED FOR NOW

    To bring the Tigers widget back later, uncomment this line:
    <div id="scores">Loading Tigers...</div>
    -->

    <div id="nhl">Loading Red Wings...</div>

</div>

<script>
/*
=====================================================
TIGERS CODE DISABLED FOR NOW

const TIGERS_TEAM_ID = 116;

function loadScores() {
    // Tigers scoreboard code can go back here later.
}

=====================================================
*/

const RED_WINGS_ABBREVIATION = "DET";
const LOOKAHEAD_DAYS = 30;

function formatGameTime(gameDate) {
    const date = new Date(gameDate);

    return date.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
    });
}

function formatGameDateAndTime(gameDate) {
    const date = new Date(gameDate);

    return date.toLocaleDateString([], {
        weekday: "short",
        month: "short",
        day: "numeric"
    }) + " at " + date.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
    });
}

function isSameLocalDay(dateA, dateB) {
    return dateA.getFullYear() === dateB.getFullYear() &&
           dateA.getMonth() === dateB.getMonth() &&
           dateA.getDate() === dateB.getDate();
}

function getESPNDateString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}${month}${day}`;
}

function isRedWingsGame(event) {
    const competition = event.competitions?.[0];
    const teams = competition?.competitors || [];

    return teams.some(team =>
        team.team?.abbreviation === RED_WINGS_ABBREVIATION ||
        team.team?.displayName === "Detroit Red Wings" ||
        team.team?.shortDisplayName === "Red Wings"
    );
}

function isGameLive(event) {
    const state = event.competitions?.[0]?.status?.type?.state;
    return state === "in";
}

function isGameUpcoming(event) {
    const state = event.competitions?.[0]?.status?.type?.state;
    return state === "pre";
}

function sortByGameDate(a, b) {
    return new Date(a.date) - new Date(b.date);
}

async function loadRedWings() {
    try {
        const today = new Date();

        const futureDate = new Date();
        futureDate.setDate(today.getDate() + LOOKAHEAD_DAYS);

        const startDate = getESPNDateString(today);
        const endDate = getESPNDateString(futureDate);

        const response = await fetch(
            `https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=${startDate}-${endDate}&limit=1000&_=${Date.now()}`,
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        const redWingsGames = (data.events || [])
            .filter(isRedWingsGame)
            .sort(sortByGameDate);

        if (redWingsGames.length === 0) {
            document.getElementById("nhl").innerHTML =
                `<div class="game nhl-game">
                    <div class="section-title">DETROIT RED WINGS</div>
                    <div class="no-game">No Red Wings Game Found</div>
                </div>`;
            return;
        }

        const game =
            redWingsGames.find(isGameLive) ||
            redWingsGames.find(isGameUpcoming) ||
            redWingsGames[0];

        const competition = game.competitions[0];
        const teams = competition.competitors;

        const awayTeam = teams.find(team => team.homeAway === "away");
        const homeTeam = teams.find(team => team.homeAway === "home");

        const away = awayTeam.team.shortDisplayName;
        const home = homeTeam.team.shortDisplayName;

        const awayScore = awayTeam.score || "-";
        const homeScore = homeTeam.score || "-";

        const awayLogo = awayTeam.team.logo || "";
        const homeLogo = homeTeam.team.logo || "";

        const statusType = competition.status.type;
        const gameDate = new Date(game.date);

        let gameDetails = statusType.shortDetail || statusType.description || "";
        let subStatus = "";

        if (statusType.state === "pre") {
            gameDetails = "Upcoming";

            if (isSameLocalDay(gameDate, today)) {
                subStatus = formatGameTime(game.date);
            } else {
                subStatus = formatGameDateAndTime(game.date);
            }
        }

        if (statusType.state === "post") {
            gameDetails = "Final";
        }

        document.getElementById("nhl").innerHTML = `
            <div class="game nhl-game">
                <div class="section-title">DETROIT RED WINGS</div>

                <div class="team-row">
                    <div class="team-info">
                        <img class="team-logo" src="${awayLogo}" alt="${away}">
                        <span class="team-name">${away}</span>
                    </div>
                    <span class="score">${awayScore}</span>
                </div>

                <div class="team-row">
                    <div class="team-info">
                        <img class="team-logo" src="${homeLogo}" alt="${home}">
                        <span class="team-name">${home}</span>
                    </div>
                    <span class="score">${homeScore}</span>
                </div>

                <div class="status">${gameDetails}</div>

                ${subStatus ? `<div class="sub-status">${subStatus}</div>` : ""}
            </div>
        `;

    } catch (error) {
        document.getElementById("nhl").innerHTML =
            `<div class="game nhl-game">
                <div class="section-title">DETROIT RED WINGS</div>
                <div class="no-game">Unable to load Red Wings scores</div>
                <div class="sub-status">${error.message}</div>
            </div>`;
    }
}

loadRedWings();

setInterval(() => {
    loadRedWings();
}, 10000);
</script>

</body>
</html>
