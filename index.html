<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Detroit Sports Scoreboard</title>
<link rel="stylesheet" href="style.css?v=15">
</head>

<body>

<div class="container">

    <!--
    TIGERS SECTION DISABLED FOR NOW

    To bring the Tigers widget back later, uncomment this line:
    <div id="scores">Loading Tigers...</div>
    -->

    <div id="nhl">Loading Red Wings...</div>

</div>

<script>
/*
=====================================================
TIGERS CODE DISABLED FOR NOW

const TIGERS_TEAM_ID = 116;

function loadScores() {
    // Tigers scoreboard code can go back here later.
}

=====================================================
*/

const RED_WINGS_ABBREVIATION = "DET";
const LOOKAHEAD_DAYS = 30;

function formatGameTime(gameDate) {
    const date = new Date(gameDate);

    return date.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
    });
}

function formatGameDateAndTime(gameDate) {
    const date = new Date(gameDate);

    return date.toLocaleDateString([], {
        weekday: "short",
        month: "short",
        day: "numeric"
    }) + " at " + date.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
    });
}

function isSameLocalDay(dateA, dateB) {
    return dateA.getFullYear() === dateB.getFullYear() &&
           dateA.getMonth() === dateB.getMonth() &&
           dateA.getDate() === dateB.getDate();
}

function getESPNDateString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}${month}${day}`;
}

function isRedWingsGame(event) {
    const competition = event.competitions?.[0];
    const teams = competition?.competitors || [];

    return teams.some(team =>
        team.team?.abbreviation === RED_WINGS_ABBREVIATION ||
        team.team?.displayName === "Detroit Red Wings" ||
        team.team?.shortDisplayName === "Red Wings"
    );
}

function isGameLive(event) {
    const state = event.competitions?.[0]?.status?.type?.state;
    return state === "in";
}

function isGameUpcoming(event) {
    const state = event.competitions?.[0]?.status?.type?.state;
    return state === "pre";
}

function sortByGameDate(a, b) {
    return new Date(a.date) - new Date(b.date);
}

async function loadRedWings() {
    try {
        const today = new Date();

        // NHL seasons use their ending year.
        // Example: 2026-27 season = 2027.
        const season = today.getFullYear() +
            (today.getMonth() >= 6 ? 1 : 0);

        // Get Detroit's schedule directly from ESPN.
        const url =
            `https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/teams/det/schedule?season=${season}&_=${Date.now()}`;

        const response = await fetch(url, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        const getState = game =>
            game.competitions?.[0]?.status?.type?.state ||
            game.status?.type?.state ||
            "";

        const games = (data.events || [])
            .filter(game =>
                game.competitions?.[0]?.competitors?.some(
                    team => team.team?.abbreviation === "DET"
                )
            )
            .sort((a, b) => new Date(a.date) - new Date(b.date));

        // Prioritize live games, today's final, then next game.
        const liveGame = games.find(game =>
            getState(game) === "in"
        );

        const finalToday = games.find(game =>
            getState(game) === "post" &&
            isSameLocalDay(new Date(game.date), today)
        );

        const upcomingGame = games.find(game =>
            getState(game) === "pre" &&
            new Date(game.date) >= today
        );

        const game = liveGame || finalToday || upcomingGame;

        if (!game) {
            document.getElementById("nhl").innerHTML = `
                <div class="game nhl-game">
                    <div class="section-title">DETROIT RED WINGS</div>
                    <div class="no-game">No Upcoming Red Wings Game</div>
                </div>
            `;
            return;
        }

        const competition = game.competitions[0];
        const teams = competition.competitors;

        const awayTeam = teams.find(t => t.homeAway === "away");
        const homeTeam = teams.find(t => t.homeAway === "home");

        if (!awayTeam || !homeTeam) {
            throw new Error("Team information unavailable");
        }

        const away = awayTeam.team.shortDisplayName;
        const home = homeTeam.team.shortDisplayName;

        const awayScore = awayTeam.score ?? "-";
        const homeScore = homeTeam.score ?? "-";

        const awayAbbr = awayTeam.team.abbreviation.toLowerCase();
        const homeAbbr = homeTeam.team.abbreviation.toLowerCase();

        const awayLogo =
            `https://a.espncdn.com/i/teamlogos/nhl/500/scoreboard/${awayAbbr}.png`;

        const homeLogo =
            `https://a.espncdn.com/i/teamlogos/nhl/500/scoreboard/${homeAbbr}.png`;

        const statusType =
            competition.status?.type ||
            game.status?.type ||
            {};

        let gameDetails = statusType.shortDetail ||
                          statusType.description ||
                          "Scheduled";

        let subStatus = "";
        const gameDate = new Date(game.date);
        const state = getState(game);

        if (state === "pre") {
            gameDetails = "Upcoming";

            if (isSameLocalDay(gameDate, today)) {
                subStatus = formatGameTime(game.date);
            } else {
                subStatus = formatGameDateAndTime(game.date);
            }

        } else if (state === "post") {
            gameDetails = statusType.shortDetail || "Final";
        }

        document.getElementById("nhl").innerHTML = `
            <div class="game nhl-game">

                <div class="section-title">
                    DETROIT RED WINGS
                </div>

                <div class="team-row">
                    <div class="team-info">
                        <img class="team-logo"
                             src="${awayLogo}"
                             alt="${away}">
                        <span class="team-name">${away}</span>
                    </div>
                    <span class="score">${awayScore}</span>
                </div>

                <div class="team-row">
                    <div class="team-info">
                        <img class="team-logo"
                             src="${homeLogo}"
                             alt="${home}">
                        <span class="team-name">${home}</span>
                    </div>
                    <span class="score">${homeScore}</span>
                </div>

                <div class="status">${gameDetails}</div>

                ${subStatus
                    ? `<div class="sub-status">${subStatus}</div>`
                    : ""}

            </div>
        `;

    } catch (error) {
        console.error("Red Wings API Error:", error);

        document.getElementById("nhl").innerHTML = `
            <div class="game nhl-game">
                <div class="section-title">
                    DETROIT RED WINGS
                </div>
                <div class="no-game">
                    Unable to load Red Wings scores
                </div>
                <div class="sub-status">
                    ${error.message}
                </div>
            </div>
        `;
    }
}

loadRedWings();

setInterval(() => {
    loadRedWings();
}, 10000);
</script>

</body>
</html>
